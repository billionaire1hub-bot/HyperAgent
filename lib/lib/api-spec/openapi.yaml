openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - OwnerBearerToken: []
tags:
  - name: health
    description: Health operations
  - name: a2a
    description: Agent-to-agent marketplace operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /a2a/auth/session:
    get:
      operationId: getA2aAuthSession
      tags: [a2a]
      summary: Check the current owner session
      security: []
      responses:
        "200":
          description: Authentication state without revealing owner credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aOwnerSession"
  /a2a/auth/login:
    post:
      operationId: loginA2aOwner
      tags: [a2a]
      summary: Sign in to the owner console
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/A2aOwnerCredentials"
      responses:
        "200":
          description: Owner session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aOwnerLogin"
        "400":
          description: Invalid login request
        "401":
          description: Invalid owner credentials
        "429":
          description: Too many failed login attempts
        "503":
          description: Owner authentication is not configured
  /a2a/auth/logout:
    post:
      operationId: logoutA2aOwner
      tags: [a2a]
      summary: End the current owner session
      responses:
        "204":
          description: Owner access token revoked
  /a2a/services:
    get:
      operationId: listA2aServices
      tags: [a2a]
      summary: List marketplace services
      responses:
        "200":
          description: Available services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/A2aService"
  /a2a/dashboard:
    get:
      operationId: getA2aDashboard
      tags: [a2a]
      summary: Get dashboard status and earnings summary
      responses:
        "200":
          description: Current dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aDashboard"
  /a2a/activity:
    get:
      operationId: listA2aActivity
      tags: [a2a]
      summary: List recent marketplace activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/A2aActivity"
  /a2a/registry/agents:
    get:
      operationId: getA2aRegistryAgents
      tags: [a2a]
      summary: Read verified global agent registry listings
      responses:
        "200":
          description: Verified public listings and read-only card connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aRegistryFeed"
  /a2a/settings:
    get:
      operationId: getA2aSettings
      tags: [a2a]
      summary: Get owner safety settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aSettings"
    patch:
      operationId: updateA2aSettings
      tags: [a2a]
      summary: Update owner safety settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/A2aSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aSettings"
  /a2a/agents/discover:
    post:
      operationId: discoverA2aAgent
      tags: [a2a]
      summary: Discover an external A2A agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/A2aAgentDiscoveryInput"
      responses:
        "200":
          description: Discovered agent card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aAgentCard"
        "400":
          description: Invalid URL or agent card
        "403":
          description: Agent is not a verified, explicit outreach opt-in
        "409":
          description: Outbound agent outreach is disabled
        "502":
          description: External agent discovery failed
  /a2a/agents/ping:
    post:
      operationId: pingA2aAgent
      tags: [a2a]
      summary: Send a connectivity ping to an external agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/A2aAgentTargetInput"
      responses:
        "200":
          description: Agent response to the ping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aAgentPing"
        "409":
          description: Outbound agent outreach is disabled
        "403":
          description: Agent is not a verified, explicit outreach opt-in
        "502":
          description: External agent ping failed
  /a2a/tasks/delegate:
    post:
      operationId: delegateA2aTask
      tags: [a2a]
      summary: External task delegation guard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/A2aTaskDelegationInput"
      responses:
        "409":
          description: Delegation is paused until upfront payment and settlement can be verified
  /a2a/webhooks/agent-response/{deliveryId}:
    post:
      operationId: receiveA2aAgentWebhook
      tags: [a2a]
      summary: Receive a one-time response callback from a delegated agent
      security: []
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/A2aAgentWebhookInput"
      responses:
        "202":
          description: Callback accepted and recorded
        "401":
          description: Invalid or expired callback token
        "404":
          description: Unknown or expired delivery
  /a2a/quote:
    post:
      operationId: createA2aQuote
      tags: [a2a]
      summary: Price and negotiate a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/A2aQuoteInput"
      responses:
        "201":
          description: Proposed task quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aQuote"
        "400":
          description: Invalid request
  /a2a/execute:
    post:
      operationId: executeA2aTask
      tags: [a2a]
      summary: Execute an accepted sandbox quote after verifying an upfront Whop payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/A2aExecuteInput"
      responses:
        "201":
          description: Sandbox task result after upfront Whop payment verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aExecution"
        "400":
          description: Invalid quote or mismatched accepted amount
        "404":
          description: Quote not found
        "409":
          description: A matching verified upfront Whop payment is required
        "503":
          description: Task provider unavailable; no result was produced
  /a2a/claim:
    post:
      operationId: claimA2aSandboxEarnings
      tags: [a2a]
      summary: Record a sandbox-only virtual withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/A2aClaimInput"
      responses:
        "201":
          description: Virtual withdrawal recorded; no external payment was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2aClaim"
        "400":
          description: Invalid amount or insufficient virtual balance
        "409":
          description: Sandbox payout switch is disabled
components:
  securitySchemes:
    OwnerBearerToken:
      type: http
      scheme: bearer
      bearerFormat: signed owner access token
  schemas:
    A2aOwnerCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 256 }
      additionalProperties: false
    A2aOwnerSession:
      type: object
      required: [authenticated, configured, username, expiresAt]
      properties:
        authenticated: { type: boolean }
        configured: { type: boolean }
        username: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"], format: date-time }
    A2aOwnerLogin:
      type: object
      required: [authenticated, username, expiresAt, accessToken]
      properties:
        authenticated: { type: boolean, enum: [true] }
        username: { type: string }
        expiresAt: { type: string, format: date-time }
        accessToken: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    A2aService:
      type: object
      required: [id, name, category, description, startingAmount, unit, active]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        startingAmount: { type: number }
        unit: { type: string }
        active: { type: boolean }
    A2aDashboard:
      type: object
      required:
        [mode, status, totalEarned, availableBalance, completedCount, activeQuotes, aiProvider, lastHeartbeat]
      properties:
        mode: { type: string, enum: [sandbox] }
        status: { type: string, enum: ["SANDBOX ACTIVE", "NEGOTIATING", "EXECUTING", "HOLDING"] }
        totalEarned: { type: number }
        availableBalance: { type: number }
        completedCount: { type: integer }
        activeQuotes: { type: integer }
        aiProvider: { type: string, enum: [Gemini, Unavailable] }
        lastHeartbeat: { type: string, format: date-time }
    A2aActivity:
      type: object
      required: [id, type, title, detail, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        detail: { type: string }
        amount: { type: ["number", "null"] }
        createdAt: { type: string, format: date-time }
    A2aSettings:
      type: object
      required: [outreachEnabled, payoutsEnabled, safeMode, payoutNote]
      properties:
        outreachEnabled: { type: boolean }
        payoutsEnabled: { type: boolean }
        safeMode: { type: boolean, enum: [true] }
        payoutNote: { type: string }
    A2aSettingsUpdate:
      type: object
      required: [outreachEnabled, payoutsEnabled]
      properties:
        outreachEnabled: { type: boolean }
        payoutsEnabled: { type: boolean }
    A2aAgentDiscoveryInput:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
      additionalProperties: false
    A2aAgentTargetInput:
      type: object
      required: [agentUrl]
      properties:
        agentUrl: { type: string, format: uri, maxLength: 2048 }
      additionalProperties: false
    A2aAgentSkill:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
    A2aRegistryAgent:
      type: object
      required: [registryId, name, description, agentUrl, verified, outreachOptIn, connectionStatus, skills, lastCheckedAt, connectionError]
      properties:
        registryId: { type: string }
        name: { type: string }
        description: { type: string }
        agentUrl: { type: ["string", "null"], format: uri }
        verified: { type: boolean, enum: [true] }
        outreachOptIn: { type: boolean }
        connectionStatus:
          type: string
          enum: [connected, opt-in-required, waiting, connection-failed]
        skills:
          type: array
          items: { $ref: "#/components/schemas/A2aAgentSkill" }
        lastCheckedAt: { type: ["string", "null"], format: date-time }
        connectionError: { type: ["string", "null"] }
    A2aRegistryFeed:
      type: object
      required: [source, status, lastSyncedAt, totalListings, skippedUnverified, verifiedListings, eligibleListings, connectedListings, agents, error]
      properties:
        source: { type: string }
        status: { type: string, enum: [ready, degraded, unavailable] }
        lastSyncedAt: { type: ["string", "null"], format: date-time }
        totalListings: { type: integer, minimum: 0 }
        skippedUnverified: { type: integer, minimum: 0 }
        verifiedListings: { type: integer, minimum: 0 }
        eligibleListings: { type: integer, minimum: 0 }
        connectedListings: { type: integer, minimum: 0 }
        agents:
          type: array
          items: { $ref: "#/components/schemas/A2aRegistryAgent" }
        error: { type: ["string", "null"] }
    A2aAgentCard:
      type: object
      required: [name, url, description, skills]
      properties:
        name: { type: string }
        url: { type: string, format: uri }
        description: { type: string }
        version: { type: string }
        skills:
          type: array
          items: { $ref: "#/components/schemas/A2aAgentSkill" }
    A2aAgentPing:
      type: object
      required: [agentName, status, response, completedAt]
      properties:
        agentName: { type: string }
        status: { type: string, enum: [responded] }
        response: { type: string }
        completedAt: { type: string, format: date-time }
    A2aTaskDelegationInput:
      type: object
      required: [agentUrl, taskText]
      properties:
        agentUrl: { type: string, format: uri, maxLength: 2048 }
        taskText: { type: string, minLength: 1, maxLength: 12000 }
      additionalProperties: false
    A2aTaskDelegation:
      type: object
      required: [agentName, status, response, completedAt]
      properties:
        agentName: { type: string }
        taskId: { type: ["string", "null"] }
        status: { type: string, enum: [completed, working, failed, timeout] }
        response: { type: string }
        completedAt: { type: string, format: date-time }
    A2aAgentWebhookInput:
      type: object
      required: [token, result]
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
        result: { type: string, minLength: 1, maxLength: 50000 }
      additionalProperties: false
    A2aQuoteInput:
      type: object
      required: [taskText, offeredAmount]
      properties:
        taskText: { type: string, minLength: 1, maxLength: 12000 }
        offeredAmount: { type: number, minimum: 0, maximum: 100000 }
    A2aQuote:
      type: object
      required:
        [id, minimumAmount, offeredAmount, proposedAmount, scopePercent, status, message, createdAt]
      properties:
        id: { type: string }
        minimumAmount: { type: number }
        offeredAmount: { type: number }
        proposedAmount: { type: number }
        scopePercent: { type: integer, minimum: 1, maximum: 100 }
        status: { type: string, enum: [standard, counteroffer, zero-offer] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    A2aExecuteInput:
      type: object
      required: [quoteId, acceptedAmount, whopPaymentId]
      properties:
        quoteId: { type: string, minLength: 1 }
        acceptedAmount: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        whopPaymentId: { type: string, minLength: 1, maxLength: 200 }
    A2aExecution:
      type: object
      required: [id, status, result, amount, executionMode, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [completed] }
        result: { type: string }
        amount: { type: number, exclusiveMinimum: 0 }
        executionMode: { type: string, enum: [Gemini] }
        createdAt: { type: string, format: date-time }
    A2aClaimInput:
      type: object
      required: [amount, method]
      properties:
        amount: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        method: { type: string, enum: [crypto, bank, paypal, payoneer] }
    A2aClaim:
      type: object
      required: [id, status, amount, method, executionMode, createdAt, note]
      properties:
        id: { type: string }
        status: { type: string, enum: [simulated] }
        amount: { type: number, exclusiveMinimum: 0 }
        method: { type: string, enum: [crypto, bank, paypal, payoneer] }
        executionMode: { type: string, enum: [sandbox] }
        createdAt: { type: string, format: date-time }
        note: { type: string }
